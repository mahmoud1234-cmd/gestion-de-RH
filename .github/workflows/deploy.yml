name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./rh-conge-front
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint --if-present || echo "No lint script"
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test -- --watch=false --browsers=ChromeHeadless || echo "No tests configured"

  backend-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./rh-conge-back
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Run tests
      run: mvn test

  deploy-frontend:
    needs: frontend-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Vercel
      uses: vercel/action@master
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        working-directory: rh-conge-front

  deploy-backend:
    needs: backend-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Railway
      uses: DerLem/railway-action@v1.0.0
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
        service: rh-conge-back
